# Time-limited RustSec exceptions. The CI validator requires this file and
# deny.toml and .cargo/audit.toml to agree exactly, and rejects entries on or
# after their expiry. Every exception has a named owner and review deadline.
# Replacing GTK3/Tauri dependencies is preferred to extending any exception.

# Reviewed 2026-10-22 against Tauri 2.12.5, keyring 4.2.0 and cargo tree --target all.
# Unicode and quick-xml exceptions were removed after updating Tauri and plist.
# GTK3/glib remain required by Tauri; keyring still requires the zbus 5 API.

[[exception]]
id = "RUSTSEC-2024-0370"
scope = "Linux GUI build dependency via Tauri GTK3 bindings"
reason = "Unmaintained proc-macro dependency; no compatible Tauri replacement is available."
owner = "Mavi security maintainers"
expires = "2027-01-20"

