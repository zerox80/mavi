version: 2
updates:
  # Maintain GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      all:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Maintain dependencies for Cargo Workspace
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      all:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Maintain every Dockerfile. One group keeps the Rust toolchain image in
  # sync across all of them instead of opening one PR per directory.
  - package-ecosystem: "docker"
    directories:
      - "/"
      - "/backend"
      - "/panel"
      - "/docker/server"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      rust-toolchain:
        patterns:
          - "rust"

  # Maintain third-party images referenced from docker-compose files
  # (Keycloak, Postgres, Traefik). Tags must name an exact version
  # (e.g. postgres:19.0-trixie); a major-only tag like postgres:19 would never
  # get a PR. Postgres major upgrades need a data migration
  # (scripts/server_installer/postgres_upgrade.py), so they are never
  # proposed automatically.
  - package-ecosystem: "docker-compose"
    directories:
      - "/backend"
      - "/backend/keycloak"
      - "/backend/panel"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "postgres"
        update-types:
          - "version-update:semver-major"

  # Maintain Android dependencies
  - package-ecosystem: "gradle"
    directory: "/android"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      all:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Maintain Tauri GUI / Frontend dependencies
  - package-ecosystem: "npm"
    directory: "/gui"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      all:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
