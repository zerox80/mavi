name: Publish VPN server image

on:
  push:
    branches: [main]
    paths:
      - docker/server/Dockerfile
      - docker/server/Dockerfile.dockerignore
      - Cargo.toml
      - Cargo.lock
      - LICENSE
      - backend/src/**
      - backend/Cargo.toml
      - backend/entrypoint.sh
      - shared/**
      - '**/Cargo.toml'
      - scripts/check_fork_sources.py
      - .github/workflows/publish-server.yml
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-vpn
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/zerox80/mavi-vpn

jobs:
  prepare:
    if: github.repository == 'zerox80/mavi' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Check out current server source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Record source revision
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: stable
      - name: Refresh branch-tracked forks for both architectures
        run: |
          cargo update -p quinn -p quinn-proto -p quinn-udp \
            -p h3 -p h3-quinn -p h3-datagram -p h2
          python3 scripts/check_fork_sources.py --check-remote
      - name: Save shared build lockfile
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-lockfile
          path: Cargo.lock
          if-no-files-found: error
          retention-days: 30

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out exact server source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          persist-credentials: false
      - name: Use shared build lockfile
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-lockfile
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push architecture by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: docker/server/Dockerfile
          platforms: linux/${{ matrix.arch }}
          pull: true
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=vpn-${{ matrix.arch }}
          cache-to: type=gha,scope=vpn-${{ matrix.arch }},mode=max
          labels: |
            org.opencontainers.image.title=Mavi VPN Server
            org.opencontainers.image.description=Prebuilt Mavi VPN server for Docker Compose
            org.opencontainers.image.source=https://github.com/zerox80/mavi
            org.opencontainers.image.url=https://github.com/zerox80/mavi
            org.opencontainers.image.revision=${{ needs.prepare.outputs.source_sha }}
            org.opencontainers.image.licenses=MIT
            io.mavi-vpn.deployment.revision=${{ github.sha }}
      - name: Export image digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - name: Save image digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Load architecture digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish combined image only after both builds succeed
        working-directory: ${{ runner.temp }}/digests
        env:
          BUILD_TAG: build-${{ github.run_id }}-${{ github.run_attempt }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
        run: |
          images=()
          for digest in *; do
            images+=("$IMAGE@sha256:$digest")
          done
          docker buildx imagetools create \
            --tag "$IMAGE:$BUILD_TAG" \
            --tag "$IMAGE:latest" \
            "${images[@]}"
          {
            docker buildx imagetools inspect "$IMAGE:$BUILD_TAG"
            echo "Server source: https://github.com/zerox80/mavi/commit/$SOURCE_SHA"
            echo "Deployment revision: $GITHUB_SHA"
            echo "Rollback image: $IMAGE:$BUILD_TAG"
          } >> "$GITHUB_STEP_SUMMARY"
