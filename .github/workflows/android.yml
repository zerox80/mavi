name: Build Android APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.event.pull_request.number || github.ref }}
  # Finish the current APK; newer pushes keep the latest pending build queued.
  cancel-in-progress: false

jobs:
  android-apk:
    name: Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      MAVI_ANDROID_BUILD_IMAGE: mavi-android-build:ci
      MAVI_ANDROID_SKIP_IMAGE_BUILD: '1'
      MAVI_ANDROID_BUILD_CONTEXT: ${{ github.workspace }}/.android-builder
      # build.sh keeps Gradle and Cargo downloads and the Rust build output here
      # instead of in Docker volumes, which a fresh runner does not have.
      MAVI_ANDROID_CACHE_DIR: ${{ github.workspace }}/.android-build-cache
      # Only main stores caches: other branches and pull requests can read
      # them, and their own copies would push main's out of the 10 GB limit.
      SAVE_CACHES: ${{ github.ref == 'refs/heads/main' }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Check out Android Docker build definition
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: zerox80/mavi-android-build
          ref: main
          path: .android-builder
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build and load image from mavi-android-build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .android-builder
          platforms: linux/amd64
          pull: true
          load: true
          push: false
          tags: mavi-android-build:ci
          cache-from: type=gha,scope=android-toolchain
          cache-to: ${{ env.SAVE_CACHES == 'true' && 'type=gha,scope=android-toolchain,mode=max' || '' }}

      - name: Read the Rust version of the build image
        id: toolchain
        shell: bash
        run: |
          version="$(docker run --rm --entrypoint rustc "$MAVI_ANDROID_BUILD_IMAGE" --version)"
          echo "rustc=$(awk '{print $2}' <<<"$version")" >> "$GITHUB_OUTPUT"

      # A new Rust release starts an empty cache: its build output cannot be
      # reused, and this also drops what earlier dependency versions left behind.
      - name: Restore Gradle, Cargo and Rust build caches
        id: build-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.MAVI_ANDROID_CACHE_DIR }}
          key: android-apk-rust${{ steps.toolchain.outputs.rustc }}-${{ hashFiles('Cargo.lock', 'android/**/*.gradle.kts', 'android/gradle/**') }}
          restore-keys: android-apk-rust${{ steps.toolchain.outputs.rustc }}-

      # The container runs as root and Git rejects repositories of another
      # user, so the restored Cargo checkouts must belong to root as well.
      - name: Hand the build caches to the container user
        shell: bash
        run: |
          mkdir -p "$MAVI_ANDROID_CACHE_DIR"
          sudo chown -R 0:0 "$MAVI_ANDROID_CACHE_DIR"

      - name: Build and verify APK with the mavi-android-build image
        shell: bash
        run: bash Android-docker-build/build.sh assembleDebug

      - name: Return the build caches to the runner user
        if: always()
        shell: bash
        run: |
          if [[ -d "$MAVI_ANDROID_CACHE_DIR" ]]; then
            sudo chown -R "$(id -u):$(id -g)" "$MAVI_ANDROID_CACHE_DIR"
          fi

      - name: Upload Android APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-apk
          path: Android-docker-build/output/apk/debug/*.apk
          if-no-files-found: error

      - name: Save lockfile with the fork revisions used for this APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-build-lockfile
          path: Cargo.lock
          if-no-files-found: error

      # Last, so that a slow or failed upload of the caches cannot hold back the APK.
      - name: Save Gradle, Cargo and Rust build caches
        if: env.SAVE_CACHES == 'true' && steps.build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.MAVI_ANDROID_CACHE_DIR }}
          key: ${{ steps.build-cache.outputs.cache-primary-key }}
