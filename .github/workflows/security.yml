name: Security Checks

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  node-supply-chain:
    name: Node dependency audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: gui/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Audit dependencies
        run: npm audit --audit-level=moderate

  rust-supply-chain:
    name: Rust dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: stable
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Only main stores caches: other branches and pull requests can read
          # them, and their own copies would push main's out of the 10 GB limit.
          save-if: ${{ github.ref == 'refs/heads/main' }}
          # Nothing is compiled here, so there is no target directory to keep.
          cache-targets: false
          # cargo-deny and cargo-audit are installed fresh by the steps below.
          cache-bin: false
      - name: Validate latest branch-tracked fork sources
        run: python3 scripts/check_fork_sources.py --check-remote
      - name: Validate synchronized RustSec exceptions
        run: python3 scripts/check_security_exceptions.py
      - name: Install cargo-deny
        uses: taiki-e/install-action@1bc50175d5a5b2af5d7bc40ba011f153ec39715a # cargo-deny
      - name: Run cargo-deny
        run: cargo deny check
      - name: Install cargo-audit
        uses: taiki-e/install-action@17dfa9a7aa66ae804b5cbd9f505a33815221f967 # cargo-audit
      - name: Run cargo-audit
        run: cargo audit --deny warnings
