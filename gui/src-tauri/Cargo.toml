[package]
name = "mavi-vpn-gui"
version.workspace = true
edition = "2021"
rust-version.workspace = true
description = "Mavi VPN Desktop GUI"
license = "MIT"
repository = "https://github.com/zerox80/mavi-vpn"
readme = "../../README.md"
keywords = ["vpn", "quic", "privacy", "tauri"]
categories = ["network-programming", "gui"]

[lib]
name = "mavi_vpn_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }


[lints]
workspace = true

[dependencies]
shared = { path = "../../shared", features = ["oauth-client"] }
tauri = { version = "2.12", features = ["tray-icon"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
rustls = { workspace = true }
bincode = { package = "bincode-next", version = "3.0.0-rc.2", features = ["serde"] }
anyhow = "1.0"
rand = "0.10"
sha2 = "0.11"
base64 = "0.23"
url = "2"
reqwest = { version = "0.13", features = ["json", "rustls-no-provider", "form"], default-features = false }
webbrowser = "1.0"
keyring = "4.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = { workspace = true }

