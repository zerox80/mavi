services:
  vpn-server:
    image: ${MAVI_IMAGE:-ghcr.io/zerox80/mavi-vpn:latest}
    container_name: mavi-vpn
    restart: unless-stopped
    network_mode: host
    env_file:
      - .env
    environment:
      RUST_LOG: ${RUST_LOG:-info}
      VPN_BIND_ADDR: ${VPN_BIND_ADDR:-0.0.0.0:10443}
      VPN_NETWORK: ${VPN_NETWORK:-10.8.0.0/24}
      VPN_NETWORK_V6: ${VPN_NETWORK_V6:-fd00::/64}
      VPN_DISABLE_IPV6: ${VPN_DISABLE_IPV6:-true}
      VPN_TUN_DEVICE: ${VPN_TUN_DEVICE:-mavi0}
      VPN_DNS: ${VPN_DNS:-1.1.1.1}
      VPN_MTU: ${VPN_MTU:-1280}
      VPN_MSS_CLAMPING: ${VPN_MSS_CLAMPING:-true}
      VPN_CENSORSHIP_RESISTANT: ${VPN_CENSORSHIP_RESISTANT:-false}
      VPN_ALLOW_CLIENT_TO_CLIENT: ${VPN_ALLOW_CLIENT_TO_CLIENT:-false}
      VPN_KEYCLOAK_ENABLED: ${VPN_KEYCLOAK_ENABLED:-false}
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - NET_BIND_SERVICE
    devices:
      - /dev/net/tun:/dev/net/tun
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    volumes:
      - ./data:/app/data
    # Same RAM + swap limit disables container swap to avoid swap thrashing.
    mem_limit: ${MAVI_MEMORY_LIMIT:-512m}
    memswap_limit: ${MAVI_MEMORY_LIMIT:-512m}
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test:
        - CMD-SHELL
        - 'ip link show dev "$${VPN_TUN_DEVICE}" >/dev/null 2>&1 && pgrep -x mavi-vpn >/dev/null'
      start_period: 60s
      interval: 30s
      timeout: 5s
      retries: 3
